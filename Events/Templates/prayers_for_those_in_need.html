{% extends "home.html" %}
{% load static %}
{% block content %}
<div style="background-image: linear-gradient(rgb(255 213 0 / 0.96), rgb(255 47 0 / 0.5))"
{% for pr in pastors_list %}
<h1> {{pr.name}}</h1>
<h1>{{pr.date}}</h1>
<h1>{{pr.prayer}}</h1>
<h2>{{pr.email}}</h2>
{% if pr.audio_segment %}
<audio src="{{ pr.audio_segment.url }}" controls></audio>
<a href="{{ pr.audio_segment.url }}" download>Download Audio</a>
{% endif %}


{%endfor%}
{% endblock %}
